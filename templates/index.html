<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go + HTMX</title>
    <link rel="stylesheet" href="static/output.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
      integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main class="max-w-3xl mx-auto">
      <h1 class="text-3xl my-4">Go + HTMX</h1>

      <div id="fruits" class="grid grid-cols-4 gap-2">
        {{range .Fruits}} {{template "fruit" .}} {{end}}
      </div>

      <h2 class="text-2xl">New fruit</h2>
      <form
        hx-post="/fruits"
        hx-target="#fruits"
        hx-swap="beforeend"
        class="grid gap-x-4 gap-y-2 grid-cols-[auto_1fr]"
      >
        <label for="name">Name</label>
        <input
          type="text"
          name="name"
          id="name"
          class="border rounded px-1 py-px"
          placeholder="Banana"
        />

        <label for="name">Description</label>
        <input
          type="text"
          name="description"
          id="description"
          class="border rounded px-1 py-px"
          placeholder="An ellongated yellow fruit"
        />
        <div>
          <button
            type="submit"
            class="border rounded px-2 py-px cursor-pointer"
          >
            Submit
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
